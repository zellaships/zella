  .error-page {

    font-size: var(--text-xl);
    color: var(--ink);
    text-decoration: none;

    border-radius: 8px;
    transition: all 0.2s ease;
    min-width: 200px;
    text-align: center;
  }

  .error-link:hover {
    background: var(--green);
    border-color: var(--green);
